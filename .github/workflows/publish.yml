name: Publish
on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: windows-latest
            args: "--bundles msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm ci

      # npm 包 @cloudworxx/tauri-plugin-mac-rounded-corners 的 postinstall 脚本
      # 会用它自带的旧版 mod.rs 覆盖本项目已提交的新版（含 set_corner_radius /
      # set_traffic_lights_visible 等扩展命令）。这里强制还原成 git 版本，
      # 否则 macOS 构建会因 lib.rs 引用了被覆盖的命令而报 E0433。
      - name: restore vendored mac plugin sources
        run: |
          git checkout -- src-tauri/src/plugins/mac_rounded_corners.rs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Leaf v${{ github.ref_name }}"
          releaseBody: "请查看 [GitHub Releases](https://github.com/pf711-dev/Leaf/releases) 了解更新内容。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
